[project]
name = "audit-log-pipeline"
version = "0.1.0"
description = "Kafka-based streaming security audit log pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka==2.16.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "psycopg[binary]==3.3.6",
    "faker==40.43.0",
]

[project.scripts]
audit-generate = "audit_pipeline.producer:main"
audit-consume  = "audit_pipeline.consumer:main"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audit_pipeline"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
    "mypy==2.4.0",
]

[tool.ruff]
target-version = "py312"
line-length    = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["audit_pipeline"]

[tool.mypy]
python_version      = "3.12"
strict              = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
